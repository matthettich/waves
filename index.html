<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>…waves</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
@font-face{font-family:Jost;src:url('./fonts/Jost-400.woff') format('woff');font-weight:400;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('./fonts/JetBrainsMono-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('./fonts/JetBrainsMono-700.woff2') format('woff2');font-weight:700;font-display:swap}
</style>
<style>
:root{
  --w-bg:#ffffff; --w-panel:#ffffff; --w-line:#d8d6dd; --w-text:#1a1a1a; --w-dim:#6d6d75;
  --w-font:Jost,system-ui,sans-serif; --w-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--w-bg);color:var(--w-text);font-family:var(--w-font);
  display:flex;flex-direction:column;overscroll-behavior:none;touch-action:manipulation}
.mono,kbd{font-family:var(--w-mono)}
.spacer{flex:1}

.bar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#fff;
  border-bottom:1px solid #1a1a1a;position:relative;z-index:20}
.bar button{background:#fff;border:1px solid #1a1a1a;border-radius:2px;padding:5px 12px;
  font:400 13px var(--w-font);color:#1a1a1a;cursor:pointer}
.bar button:hover{background:#f0f0f2}
.menu-pop{position:absolute;top:100%;left:8px;z-index:30;background:#fff;border:1px solid #1a1a1a;
  border-radius:2px;box-shadow:0 6px 18px rgba(0,0,0,.16);padding:5px;min-width:232px;max-height:70vh;overflow:auto}
.menu-pop button{display:block;width:100%;text-align:left;background:transparent;border:0;
  border-radius:2px;padding:5px 9px;font:400 13px var(--w-font);color:#1a1a1a;cursor:pointer}
.menu-pop button:hover{background:#f0f0f2}
.menu-pop .mg{font:600 10px var(--w-font);text-transform:uppercase;letter-spacing:.08em;
  color:var(--w-dim);padding:8px 9px 3px}
.menu-pop .mi{display:flex;align-items:center;gap:8px;padding:6px 9px;font-size:13px}
.menu-pop hr{border:0;border-top:1px solid var(--w-line);margin:5px 0}

.mid{display:flex;flex:1;min-height:0}
.drawer{display:flex;flex:0 0 auto;background:#fff;border-right:1px solid #1a1a1a}
.drawer.collapsed .dw-body{display:none}
.dw-tab{width:26px;flex:0 0 auto;border-right:1px solid var(--w-line);cursor:pointer;
  display:flex;justify-content:center;padding-top:14px}
.dw-tab span{writing-mode:vertical-rl;transform:rotate(180deg);
  font:600 12px var(--w-font);letter-spacing:.06em;color:#1a1a1a}
.dw-body{width:262px;flex:0 0 auto;overflow-y:auto;min-height:0}
.dw-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;
  border-bottom:1px solid #1a1a1a}
.dw-head h2{margin:0;font:600 16px var(--w-font)}
.dw-mini{background:#fff;border:1px solid #1a1a1a;border-radius:2px;padding:4px 10px;
  font:400 12px var(--w-font);cursor:pointer;color:#1a1a1a}
.dw-quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 14px;
  border-bottom:1px solid var(--w-line)}
.dw-q{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #1a1a1a;
  border-radius:2px;padding:12px 9px;font:400 14px var(--w-font);cursor:pointer;color:#1a1a1a}
.dw-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.dw-group{display:flex;align-items:center;gap:8px;width:100%;background:#f4f4f6;border:0;
  border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a;padding:10px 12px;
  font:500 14px var(--w-font);cursor:pointer;color:#1a1a1a;text-align:left}
.dw-chev{font-family:var(--w-mono);width:12px}
.dw-count{margin-left:auto;font-family:var(--w-mono);font-size:12px;color:var(--w-dim)}
.dw-item{display:flex;align-items:center;gap:8px;background:#fff;border:0;
  border-bottom:1px solid #e6e6e6;padding:11px 14px;font:400 14px var(--w-font);
  cursor:pointer;color:#1a1a1a;text-align:left;width:100%}
.dw-item:hover{background:#f0f0f2}
.dw-star{margin-left:auto;color:#b9b9c0}

.patch{position:relative;flex:1;overflow:hidden;background:#fff;touch-action:none;
  user-select:none;-webkit-user-select:none}
.patch .cables,.patch .groups,.patch .mods{position:absolute;inset:0;transform-origin:0 0}
.patch .cables{overflow:visible;pointer-events:none}
.cable{fill:none;stroke-width:1.8;stroke-linecap:round}
.cable--temp{stroke-dasharray:4 4}
.cable-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke}
.patch .mods{pointer-events:none}
.group{position:absolute;border:1.5px dashed;border-radius:6px;pointer-events:none}
.group .group-n{position:absolute;top:-9px;left:12px;font:600 10px var(--w-font);
  background:#fff;padding:0 6px;text-transform:uppercase;letter-spacing:.08em}

.mod{--c:#666;position:absolute;width:190px;background:#fff;border:1.5px solid var(--c);
  border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.14);pointer-events:auto}
.mod[data-type="hostIn"]{--c:#e8952f}
.mod[data-type="vco"]{--c:#2f6fed}
.mod[data-type="lfo"]{--c:#7c5cff}
.mod[data-type="adsr"]{--c:#2aa198}
.mod[data-type="vca"]{--c:#e0503f}
.mod[data-type="vcf"]{--c:#c4417f}
.mod[data-type="plaits"]{--c:#8b6ce8}
.mod[data-type="out"]{--c:#3fa66a}
.mod-t{display:flex;align-items:center;gap:6px;padding:4px 5px 5px;background:#fff;
  border-bottom:1px solid var(--c);cursor:grab}
.mod-caret{display:none}
.mod-name{background:var(--c);color:#fff;font:500 11px var(--w-font);padding:1px 5px;
  border-radius:2px;flex:0 0 auto}
.mod-note{font-family:var(--w-mono);font-size:9px;color:var(--w-dim);margin-left:auto}
.mod-x{flex:0 0 auto;width:20px;height:20px;margin-left:8px;padding:0;border:0;
  background:transparent;color:var(--w-dim);font:400 15px/20px var(--w-font);
  cursor:pointer;border-radius:3px;text-align:center}
.mod-x:hover{background:#f0eef6;color:#c0392b}
.mod.selected{outline:1.5px dashed #1a1a1a;outline-offset:2px}
.mod.collapsed .mod-b{display:none}
.row{display:flex;align-items:center;gap:6px;padding:4px 8px}
.row-out,.row-in{min-height:16px}
.row-out{justify-content:flex-end}
.jack{width:11px;height:11px;padding:0;border:1.5px solid #2b2b2b;border-radius:50%;
  background:var(--c);cursor:crosshair}
.jack--mod{width:8px;height:8px;border-width:1px}
.row-ctl{display:block;padding:0}
.ctl{display:grid;grid-template-columns:8px minmax(0,1fr) 66px 34px;align-items:center;
  gap:6px;padding:3px 6px;font-size:11px}
.ctl-n{min-width:0;color:var(--w-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl-n.cc{color:#7c5cff}
.ctl-s{-webkit-appearance:none;appearance:none;height:2px;background:#d8d8d8;border-radius:0;outline:none}
.ctl-s::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;
  background:#2b2b2b;border:0;cursor:pointer}
.ctl-v{font-family:var(--w-mono);font-size:10px;text-align:right;color:var(--w-text)}
.mod-meter{display:block;width:100%;height:4px;border-radius:0;background:#e6e6e6;overflow:hidden}
.mod-meter i{display:block;height:100%;background:var(--c);transform-origin:left;transform:scaleX(0)}

.status{display:flex;align-items:center;gap:12px;padding:4px 10px;background:#fff;
  border-top:1px solid var(--w-line);font-size:10px;color:var(--w-dim);min-height:26px}
.cpu.gold{color:#a8720b}.cpu.red{color:#b3261e}
.meters{display:flex;gap:4px}
.meters .b{width:14px;height:8px;border-radius:0;background:#e6e6e6;position:relative;overflow:hidden}
.meters .b i{position:absolute;inset:0;transform-origin:left;background:#2b2b2b;transform:scaleX(0)}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#fff;
  border:1px solid #1a1a1a;border-radius:2px;padding:8px 13px;font-size:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.16);z-index:60;max-width:88vw}
.touchkeys{display:flex;gap:3px}
.touchkeys button{font:600 11px var(--w-mono);padding:7px 0;width:30px;border:1px solid #1a1a1a;
  background:#fff;color:#1a1a1a;border-radius:2px}
@media (pointer:coarse){
  .jack{width:16px;height:16px}.jack--mod{width:11px;height:11px}
  .row{padding:7px 10px}.ctl{padding:4px 10px}.mod{width:206px}.bar button{padding:8px 12px}
}
@media (max-width:700px){.drawer{display:none}}
</style>
</head><body>

<header id="bar" class="bar"></header>
<div class="mid">
  <aside id="drawer" class="drawer"></aside>
  <main id="patch" class="patch" tabindex="0"></main>
</div>
<div id="status" class="status">
  <span id="cpu" class="cpu">CPU -</span>
  <span id="vcount" class="mono">0 voices</span>
  <span class="spacer"></span>
  <span id="meters" class="meters"></span>
  <span id="touchkeys" class="touchkeys" hidden></span>
</div>
<div id="toast" class="toast" hidden></div>

<template id="t-module">
  <section class="mod" tabindex="0">
    <header class="mod-t"><span class="mod-caret"></span><span class="mod-name"></span><span class="mod-note"></span></header>
    <div class="mod-b"><div class="row row-out"></div><div class="row row-in"></div><div class="row row-ctl"></div></div>
  </section>
</template>

<script type="module">
const PROTOCOL = 1, TARGET = 'waves', BUS_COUNT = 8;
const OP = { patch:'patch', add:'add', remove:'remove', connect:'connect', disconnect:'disconnect',
  params:'params', quality:'quality', transport:'transport', telemetry:'telemetry',
  noteOn:'noteOn', noteOff:'noteOff', panic:'panic',
  ready:'ready', meter:'meter', shed:'shed', error:'error' };

const COLORS = { hostIn:'#e8952f', vco:'#2f6fed', lfo:'#7c5cff', adsr:'#2aa198',
                 vca:'#e0503f', vcf:'#c4417f', plaits:'#8b6ce8', out:'#3fa66a' };

const MODULES = {
  hostIn:{ type:'hostIn', label:'Host In', scope:'poly',
    inputs:{}, outputs:{ pitch:'cv', gate:'gate', vel:'cv' },
    params:{ transpose:[0,-48,48,1] } },
  vco:{ type:'vco', label:'VCO', scope:'poly',
    inputs:{ pitch:'cv', fm:'cv' }, outputs:{ out:'audio' },
    params:{ wave:[1,0,3,1], tune:[0,-24,24,1], fine:[0,-100,100,1] } },
  lfo:{ type:'lfo', label:'LFO', scope:'mono',
    inputs:{ reset:'gate' }, outputs:{ out:'cv' },
    params:{ rate:[1,.02,40,.01], sync:[0,0,1,1], shape:[0,0,2,1] } },
  adsr:{ type:'adsr', label:'ADSR', scope:'poly',
    inputs:{ gate:'gate' }, outputs:{ out:'cv' },
    params:{ a:[.01,0,4,.001], d:[.2,0,4,.001], s:[.7,0,1,.001], r:[.3,0,8,.001] } },
  vca:{ type:'vca', label:'VCA', scope:'poly',
    inputs:{ in:'audio', cv:'cv' }, outputs:{ out:'audio' },
    params:{ gain:[1,0,4,.01] } },
  vcf:{ type:'vcf', label:'VCF', scope:'poly',
    inputs:{ in:'audio', cutoff:'cv' }, outputs:{ out:'audio' },
    params:{ cutoff:[.5,0,1,.001], res:[.3,0,1,.001], mode:[0,0,2,1] } },
  plaits:{ type:'plaits', label:'Plaits', scope:'poly',
    inputs:{ pitch:'cv', gate:'gate', timbre:'cv', morph:'cv' },
    outputs:{ out:'audio', aux:'audio' },
    params:{ engine:[8,0,23,1], harmonics:[.5,0,1,.01], timbre:[.5,0,1,.01], morph:[.5,0,1,.01], decay:[.5,0,1,.01] } },
  out:{ type:'out', label:'Out', scope:'mono',
    inputs:{ in:'audio' }, outputs:{},
    params:{ slot:[1,1,BUS_COUNT,1], level:[1,0,2,.01] } }
};

let _toastTimer = 0;
function toast(msg, ms) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function () { t.hidden = true; }, ms || 2800);
}
function setCpu(load, quality) {
  var el = document.getElementById('cpu');
  el.textContent = 'CPU ' + Math.round(load * 100) + '%' + (quality === 'draft' ? ' / draft' : '');
  el.classList.toggle('gold', load > .5 && load <= .8);
  el.classList.toggle('red', load > .8);
}
function setVoices(n, quality) {
  document.getElementById('vcount').textContent =
    n + ' voice' + (n === 1 ? '' : 's') + (quality === 'draft' ? ' / draft' : '');
}
var _meters = null;
function initMeters(count) {
  var host = document.getElementById('meters'); host.innerHTML = ''; _meters = [];
  for (var k = 0; k < (count || BUS_COUNT); k++) {
    var b = document.createElement('div'); b.className = 'b';
    b.title = 'Out ' + (k + 1) + ' / Waves In ' + (k + 1);
    b.innerHTML = '<i></i>'; host.append(b); _meters.push(b.querySelector('i'));
  }
}
function setBus(k, peak) {
  var m = _meters && _meters[k - 1];
  if (m) m.style.transform = 'scaleX(' + Math.min(1, peak) + ')';
}
var K_LOW = ['z','s','x','d','c','v','g','b','h','n','j','m',',','l','.',';','/'];
var K_UP  = ['q','2','w','3','e','r','5','t','6','y','7','u','i','9','o','0','p'];
function wireKeyboard(bridge) {
  var octave = 0, held = new Map();
  function pitchOf(k) {
    var i = K_LOW.indexOf(k), j = K_UP.indexOf(k);
    return i >= 0 ? i : (j >= 0 ? 12 + j : -1);
  }
  addEventListener('keydown', function (e) {
    if (e.repeat || e.metaKey || e.ctrlKey) return;
    if (e.key === '-' || e.key === '=') { octave += (e.key === '=' ? 1 : -1); toast('Octave ' + (octave + 4)); return; }
    var p = pitchOf(e.key); if (p < 0 || held.has(e.key)) return;
    var pitch = p + octave * 12; held.set(e.key, pitch); bridge.noteOn(pitch, 1);
  });
  addEventListener('keyup', function (e) {
    var pitch = held.get(e.key); if (pitch == null) return;
    held.delete(e.key); bridge.noteOff(pitch);
  });
  addEventListener('blur', function () { held.forEach(function (p) { bridge.noteOff(p); }); held.clear(); });
}
function showTouchKeyboard(bridge) {
  var host = document.getElementById('touchkeys'); host.hidden = false; host.innerHTML = '';
  var names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B','C'];
  function mk(i) {
    var b = document.createElement('button'); b.textContent = names[i];
    function on(e) { e.preventDefault(); b.dataset.on = '1'; bridge.noteOn(i, 1); }
    function off() { if (b.dataset.on) { delete b.dataset.on; bridge.noteOff(i); } }
    b.addEventListener('pointerdown', on);
    addEventListener('pointerup', off); b.addEventListener('pointerleave', off);
    return b;
  }
  for (var i = 0; i < 13; i++) host.append(mk(i));
}
function showHelp() {
  toast('Drag an output jack to an input jack to patch. Every slider has a purple jack for '
      + 'modulation. Double-click a cable to remove it, or a module title to collapse. '
      + 'Shift-click to select, right-click to group. Drag the background to pan, pinch to zoom.');
}

const CardHooks = { onParam: function(){}, onGestureStart: function(){}, onCommit: function(){}, learn: null };

function makeJack(id, port, kind, dir) {
  var j = document.createElement('button');
  j.className = 'jack jack--' + kind + ' jack--' + dir;
  j.dataset.id = id; j.dataset.port = port; j.dataset.kind = kind;
  j.title = port;
  return j;
}
function makeSlider(mod, name, spec) {
  var def = spec[0], min = spec[1], max = spec[2], step = spec[3];
  var v = (mod.params[name] != null) ? mod.params[name] : def;
  var wrap = document.createElement('label');
  wrap.className = 'ctl'; wrap.dataset.id = mod.id; wrap.dataset.port = name;
  wrap.innerHTML =
    '<button class="jack jack--cv jack--in jack--mod" data-id="' + mod.id + '" data-port="' + name +
    '" data-kind="cv" title="' + name + ' modulation"></button>' +
    '<span class="ctl-n">' + name + '</span>' +
    '<input class="ctl-s" type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + v + '">' +
    '<output class="ctl-v">' + (+v).toFixed(2) + '</output>';
  var input = wrap.querySelector('.ctl-s'), out = wrap.querySelector('.ctl-v');
  input.addEventListener('pointerdown', function () {
    CardHooks.onGestureStart();
    if (CardHooks.learn) CardHooks.learn.arm({ id: mod.id, name: name });
  });
  input.addEventListener('input', function () {
    var n = parseFloat(input.value);
    mod.params[name] = n; out.textContent = n.toFixed(2);
    CardHooks.onParam(mod.id, name, n);
  });
  return wrap;
}
function renderCard(doc, def, mod) {
  var el = document.getElementById('t-module').content.firstElementChild.cloneNode(true);
  el.dataset.id = mod.id;
  el.dataset.type = def.type;
  el.querySelector('.mod-name').textContent = mod.label || def.label;
  if (def.type === 'hostIn') el.querySelector('.mod-note').textContent = 'Keyboard / MIDI';
  if (def.type === 'out') {
    el.querySelector('.mod-note').textContent = 'Waves In ' + mod.params.slot;
    el.querySelector('.mod-b').insertAdjacentHTML('beforeend',
      '<div class="row"><span class="mod-meter"><i></i></span></div>');
  }
  el.querySelector('.mod-t').insertAdjacentHTML('beforeend',
    '<button class="mod-x" title="Remove module">\u00d7</button>');
  var rout = el.querySelector('.row-out'), k;
  for (k in def.outputs) rout.append(makeJack(mod.id, k, def.outputs[k], 'out'));
  var rin = el.querySelector('.row-in');
  for (k in def.inputs) rin.append(makeJack(mod.id, k, def.inputs[k], 'in'));
  var rctl = el.querySelector('.row-ctl');
  for (k in def.params) rctl.append(makeSlider(mod, k, def.params[k]));
  return el;
}
function paintAllCc(learn) {
  var els = document.querySelectorAll('.ctl');
  for (var i = 0; i < els.length; i++) {
    var el = els[i], name = el.dataset.port;
    var cc = learn ? learn.ccFor(el.dataset.id, name) : null;
    var label = el.querySelector('.ctl-n');
    label.textContent = (cc == null) ? name : (name + ' / CC' + cc);
    label.classList.toggle('cc', cc != null);
  }
}

const STORE_KEY = 'waves.patch', BAK_KEY = 'waves.backups', MAX_BAK = 10;
class PatchStore {
  constructor(doc) {
    this.doc = doc; this.onRestore = function () {};
    this.undo = []; this.redo = []; this._timer = 0; this.dirty = false;
  }
  snapshot() {
    this.undo.push(JSON.stringify(this.doc));
    if (this.undo.length > 60) this.undo.shift();
    this.redo.length = 0; this._schedule();
  }
  back() {
    if (!this.undo.length) return false;
    this.redo.push(JSON.stringify(this.doc)); this._restore(this.undo.pop()); return true;
  }
  forward() {
    if (!this.redo.length) return false;
    this.undo.push(JSON.stringify(this.doc)); this._restore(this.redo.pop()); return true;
  }
  _restore(json) {
    Object.assign(this.doc, JSON.parse(json)); this.onRestore(this.doc); this._schedule();
  }
  touch() { this._schedule(); }
  _schedule() {
    this.dirty = true; clearTimeout(this._timer);
    var self = this; this._timer = setTimeout(function () { self.save(); }, 1200);
  }
  save() {
    if (!this.dirty) return;
    try {
      var baks = JSON.parse(localStorage.getItem(BAK_KEY) || '[]');
      baks.push({ t: Date.now(), p: localStorage.getItem(STORE_KEY) || 'null' });
      while (baks.length > MAX_BAK) baks.shift();
      localStorage.setItem(BAK_KEY, JSON.stringify(baks));
      this.doc.meta.modified = Math.floor(Date.now() / 1000);
      localStorage.setItem(STORE_KEY, JSON.stringify(this.doc));
      this.dirty = false;
    } catch (e) {}
  }
  static open() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { return null; } }
  static backups() { try { return JSON.parse(localStorage.getItem(BAK_KEY) || '[]'); } catch (e) { return []; } }
  exportTo(name) {
    var blob = new Blob([JSON.stringify(this.doc, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (name || this.doc.meta.name || 'patch') + '.waves.json';
    a.click(); URL.revokeObjectURL(a.href); this.dirty = false;
  }
  importFrom(file) {
    var self = this;
    return file.text().then(function (txt) {
      var d = JSON.parse(txt);
      if (d.format !== 'waves.patch') throw new Error('Not a patch');
      Object.assign(self.doc, d); self.onRestore(self.doc); self._schedule();
    });
  }
  exportCustom() {
    var blob = new Blob([JSON.stringify({ format:'waves.custom', custom:this.doc.custom }, null, 2)],
      { type:'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'custom-modules.json'; a.click(); URL.revokeObjectURL(a.href);
  }
  importCustom(file) {
    var self = this;
    return file.text().then(function (txt) {
      var d = JSON.parse(txt);
      if (d.format !== 'waves.custom') throw new Error('Not a custom-module file');
      self.doc.custom = self.doc.custom.concat(d.custom); self._schedule();
    });
  }
}

const LEARN_KEY = 'waves.midi';
class MidiLearn {
  constructor(getRange) {

}

const MENU_GROUPS = {
  Standard:['vco','vcf','vca'],
  Modulation:['lfo','adsr'],
  Routing:['hostIn','out'],
  Voices:['plaits']
};
function blankDoc() {
  return { format:'waves.patch', version:1,
    meta:{ name:'Untitled', created:Math.floor(Date.now() / 1000), modified:Math.floor(Date.now() / 1000) },
    voice:{ mode:'poly', maxVoices:8, steal:'oldest', glide:0 },
    transport:{ tempo:120, lpb:4, ticks:6, swing:0 },
    host:{ envelopes:'internal' },
    modules:[], cables:[], groups:[], custom:[], view:{ x:0, y:0, zoom:1 } };
}
function starterDoc() {
  var d = blankDoc();
  d.modules = [
    { id:'m1', type:'hostIn', scope:'poly', pos:[ 24,  70], collapsed:false, params:{ transpose:0 } },
    { id:'m2', type:'vco',    scope:'poly', pos:[254,  70], collapsed:false, params:{ wave:1, tune:0, fine:0 } },
    { id:'m3', type:'adsr',   scope:'poly', pos:[484,  70], collapsed:false, params:{ a:.005, d:.2, s:.7, r:.3 } },
    { id:'m4', type:'vca',    scope:'poly', pos:[714,  70], collapsed:false, params:{ gain:1 } },
    { id:'m5', type:'out',    scope:'mono', pos:[944,  70], collapsed:false, params:{ slot:1, level:1 } }
  ];
  d.cables = [
    { from:['m1','pitch'], to:['m2','pitch'], bend:0 },
    { from:['m1','gate'],  to:['m3','gate'],  bend:0 },
    { from:['m2','out'],   to:['m4','in'],    bend:0 },
    { from:['m3','out'],   to:['m4','cv'],    bend:0 },
    { from:['m4','out'],   to:['m5','in'],    bend:0 }
  ];
  return d;
}

function buildMenu(bar, canvas, store) {
  bar.innerHTML =
    '<div class="menu">' +
      '<button data-m="file">File</button>' +
      '<button data-m="settings">Settings</button>' +
      '<button data-m="modules">Modules</button>' +
      '<button data-a="help">Help</button>' +
      '<span class="spacer"></span>' +
      '<button data-a="backup">Backups</button>' +
    '</div>';
  var panel = document.createElement('div');
  panel.className = 'menu-pop'; panel.hidden = true; bar.append(panel);

  function show(which) {
    panel.innerHTML = which === 'file' ? fileMenu() : (which === 'settings' ? settingsMenu() : moduleMenu());
    panel.hidden = false;
    var els = panel.querySelectorAll('[data-act]');
    for (var i = 0; i < els.length; i++) {
      (function (el) {
        if (el.tagName === 'SELECT') el.onchange = function () { run(el.dataset.act, el); };
        else if (el.type === 'range') el.oninput = function () { run(el.dataset.act, el); };
        else el.onclick = function () { run(el.dataset.act, el); };
      })(els[i]);
    }
  }
  function fileMenu() {
    function it(a, l) { return '<button data-act="' + a + '">' + l + '</button>'; }
    return it('new','New') + it('open','Open...') + it('save','Save') + it('saveas','Save as...')
      + it('undo','Undo') + it('redo','Redo')
      + '<hr>' + it('export-custom','Export custom modules...') + it('import-custom','Import custom modules...')
      + '<hr>' + it('export','Export patch (.json)...');
  }
  function settingsMenu() {
    return '<label class="mi">Quality <select data-act="quality">' +
             '<option value="full">Full</option><option value="draft">Draft</option>' +
           '</select></label>' +
           '<label class="mi">Voices <input type="range" min="1" max="16" value="' +
             store.doc.voice.maxVoices + '" data-act="voices" style="flex:1"></label>';
  }
  function moduleMenu() {
    var html = '', g, t;
    for (g in MENU_GROUPS) {
      html += '<div class="mg">' + g + '</div>';
      for (var i = 0; i < MENU_GROUPS[g].length; i++) {
        t = MENU_GROUPS[g][i];
        html += '<button data-act="add:' + t + '">' + MODULES[t].label + '</button>';
      }
    }
    if (store.doc.custom.length) {
      html += '<hr><div class="mg">Custom modules</div>';
      for (var c = 0; c < store.doc.custom.length; c++)
        html += '<button data-act="addcustom:' + store.doc.custom[c].id + '">' + store.doc.custom[c].name + '</button>';
    }
    return html + '<hr><button data-act="capture">Capture selection...</button>'
      + '<button data-act="group">Group selected</button><button data-act="tidy">Tidy up</button>'
      + '<button data-act="remove">Remove selected</button>';
  }
  function pick(accept, fn) {
    var f = document.createElement('input');
    f.type = 'file'; f.accept = accept; f.hidden = true;
    document.body.append(f);
    f.onchange = function () { if (f.files[0]) fn(f.files[0]); };
    f.click();
  }
  function run(act, el) {
    var parts = act.split(':'), verb = parts[0], arg = parts[1];
    panel.hidden = true;
    if (verb === 'new') {
      if (!confirm('New patch? The current one is backed up.')) return;
      store.snapshot();
      var b = blankDoc(); for (var k in b) store.doc[k] = b[k];
      store.dirty = true; store.save(); canvas.build();
    } else if (verb === 'open') pick('.json,.waves.json', function (f) { store.importFrom(f); });
    else if (verb === 'save') { store.dirty = true; store.save(); toast('Saved'); }
    else if (verb === 'saveas') {
      var name = prompt('Patch name', store.doc.meta.name);
      if (name) { store.snapshot(); store.doc.meta.name = name; store.exportTo(name); }
    }
    else if (verb === 'undo') { if (store.back()) canvas.build(); }
    else if (verb === 'redo') { if (store.forward()) canvas.build(); }
    else if (verb === 'export') store.exportTo();
    else if (verb === 'export-custom') store.exportCustom();
    else if (verb === 'import-custom') pick('.json', function (f) { store.importCustom(f); });
    else if (verb === 'add') {
      store.snapshot();
      var m = canvas.addModule(arg, [120 + canvas.doc.modules.length * 24, 120]);
      canvas.sel.clear(); canvas.sel.add(m.id); canvas._markSel();
    }
    else if (verb === 'addcustom') { store.snapshot(); canvas.addCustom(arg, [140, 140]); }
    else if (verb === 'capture') {
      if (canvas.sel.size < 2) { toast('Select two or more modules first.'); return; }
      var n2 = prompt('Custom module name', 'My Voice');
      if (n2) canvas.captureCustom(n2, Array.from(canvas.sel));
    }
    else if (verb === 'group') canvas.group(Array.from(canvas.sel));
    else if (verb === 'tidy') { store.snapshot(); canvas.tidy(); }
    else if (verb === 'remove') { Array.from(canvas.sel).forEach(function (id) { canvas.removeModule(id); }); }
    else if (verb === 'voices' && el) canvas.onVoices && canvas.onVoices(+el.value);
    else if (verb === 'quality' && el) canvas.onQuality && canvas.onQuality(el.value);
  }
  bar.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'help') { showHelp(); return; }
    if (b.dataset.a === 'backup') { openBackups(); return; }
    if (b.dataset.m) show(b.dataset.m);
  });
  document.addEventListener('pointerdown', function (e) { if (!bar.contains(e.target)) panel.hidden = true; });

  function openBackups() {
    var list = PatchStore.backups(), html = '<div class="mg">Earlier versions</div>';
    if (list.length) {
      for (var i = 0; i < list.length; i++)
        html += '<button data-act="restore:' + i + '">' + new Date(list[i].t).toLocaleString() + '</button>';
    } else html += '<div class="mi">No backups yet.</div>';
    panel.innerHTML = html; panel.hidden = false;
    var els = panel.querySelectorAll('[data-act^="restore"]');
    for (var j = 0; j < els.length; j++) (function (el) {
      el.onclick = function () {
        store.snapshot();
        store._restore(PatchStore.backups()[+el.dataset.act.split(':')[1]].p);
        canvas.build(); panel.hidden = true;
      };
    })(els[j]);
  }
}

function buildDrawer(drawer, canvas, store) {
  var QUICK = ['hostIn','vco','adsr','vca','out'];
  var GROUPS = [
    { name:'Standard',   types:['vco','vcf','vca'] },
    { name:'Modulation', types:['lfo','adsr'] },
    { name:'Routing',    types:['hostIn','out'] },
    { name:'Voices',     types:['plaits'] }
  ];
  var open = {};
  function dot(t) { return '<span class="dw-dot" style="background:' + (COLORS[t] || '#888') + '"></span>'; }
  function render() {
    var h = '<div class="dw-tab" data-act="toggle"><span>Modules</span></div><div class="dw-body">';
    h += '<div class="dw-head"><h2>Modules</h2><button class="dw-mini" data-act="collapse">Collapse all</button></div>';
    h += '<div class="dw-quick">';
    for (var i = 0; i < QUICK.length; i++) {
      var t = QUICK[i];
      h += '<button class="dw-q" style="border-color:' + (COLORS[t] || '#1a1a1a') + '" data-add="' + t + '">'
         + dot(t) + '<span>' + MODULES[t].label + '</span></button>';
    }
    h += '</div>';
    for (var g = 0; g < GROUPS.length; g++) {
      var grp = GROUPS[g], isOpen = open[grp.name] !== false;
      h += '<button class="dw-group" data-group="' + grp.name + '"><span class="dw-chev">'
         + (isOpen ? 'v' : '>') + '</span>' + grp.name
         + '<span class="dw-count">' + grp.types.length + '</span></button>';
      if (isOpen) {
        h += '<div class="dw-items">';
        for (var k = 0; k < grp.types.length; k++) {
          var tt = grp.types[k];
          h += '<button class="dw-item" data-add="' + tt + '">' + dot(tt) + '<span>'
             + MODULES[tt].label + '</span><span class="dw-star">&#9734;</span></button>';
        }
        h += '</div>';
      }
    }
    drawer.innerHTML = h + '</div>';
  }
  drawer.addEventListener('click', function (e) {
    var add = e.target.closest('[data-add]');
    if (add) {
      store.snapshot();
      var m = canvas.addModule(add.dataset.add, [120 + canvas.doc.modules.length * 24, 120]);
      canvas.sel.clear(); canvas.sel.add(m.id); canvas._markSel();
      return;
    }
    var grp = e.target.closest('[data-group]');
    if (grp) { open[grp.dataset.group] = !(open[grp.dataset.group] !== false); render(); return; }
    var act = e.target.closest('[data-act]');
    if (!act) return;
    if (act.dataset.act === 'toggle') drawer.classList.toggle('collapsed');
    if (act.dataset.act === 'collapse') { for (var i = 0; i < GROUPS.length; i++) open[GROUPS[i].name] = false; render(); }
  });
  render();
}

initMeters(BUS_COUNT);

var doc = PatchStore.open() || starterDoc();
var store = new PatchStore(doc);
var maxVoices = (doc.voice && doc.voice.maxVoices) || 8;
var bridge = null, canvas = null;

WavesBridge.standalone({ maxVoices: maxVoices, quality: doc.quality || 'full' }).then(function (b) {
  bridge = b;
  bridge.telemetry(true);
  bridge.on('meter', function (m) {
    setCpu(m.load, m.quality); setVoices(m.active, m.quality);
    for (var k = 0; k < m.buses.length; k++) setBus(k + 1, m.buses[k]);
    if (canvas) canvas.updateMeters(m.buses);
  });
  bridge.on('shed', function (s) { toast('Shedding load - ' + s.voices + ' voices'); });
  bridge.on('error', function (e) { toast(e.message); });
  bridge.loadPatch(doc);

  canvas = new PatchCanvas(document.getElementById('patch'), {
    bridge: bridge, doc: doc, onChange: function () { store.snapshot(); }
  });
  store.onRestore = function () { canvas.build(); bridge.loadPatch(doc); };
  canvas.onVoices = function (n) {
    maxVoices = n; doc.voice.maxVoices = n; store.dirty = true; store.save();
    toast('Reloading with ' + n + ' voices...');
    WavesBridge.standalone({ maxVoices: n }).then(function (b2) {
      bridge.dispose(); bridge = b2; canvas.bridge = b2;
      b2.on('meter', function (m) { setCpu(m.load, m.quality); setVoices(m.active, m.quality); });
      b2.telemetry(true); b2.loadPatch(doc);
    });
  };
  canvas.onQuality = function (q) { doc.quality = q; bridge.setQuality(q); };

  var learn = new MidiLearn(function (id, name) {
    var mm = null;
    for (var i = 0; i < doc.modules.length; i++) if (doc.modules[i].id === id) { mm = doc.modules[i]; break; }
    var spec = mm ? MODULES[mm.type].params[name] : [0, 0, 1, 0];
    return { min:spec[1], max:spec[2] };
  });
  CardHooks.learn = learn;
  CardHooks.onGestureStart = function () { store.snapshot(); };
  CardHooks.onParam = function (id, name, v) { bridge.setParam(id, name, v); store.touch(); };

  buildMenu(document.getElementById('bar'), canvas, store);
  buildDrawer(document.getElementById('drawer'), canvas, store);

  function unlockAudio() {
    if (bridge) bridge.resume();
    removeEventListener('pointerdown', unlockAudio);
    removeEventListener('keydown', unlockAudio);
  }
  addEventListener('pointerdown', unlockAudio);
  addEventListener('keydown', unlockAudio);

  var midi = new WavesMidi({
    onNote: function (o) { if (o.on) bridge.noteOn(o.pitch, o.vel); else bridge.noteOff(o.pitch); },
    onCC: function (cc, val) {
      var did = learn.handle(cc, val, bridge);
      if (did.learned != null) { toast('Learned CC' + did.learned); paintAllCc(learn); }
    },
    onTransport: function (t) { if (t.tempo) bridge.setTransport({ tempo: Math.round(t.tempo * 10) / 10 }); }
  });
  midi.start().then(function (st) {
    if (!st.ok) showTouchKeyboard(bridge);
  }).catch(function () { showTouchKeyboard(bridge); });
  wireKeyboard(bridge);
});
</script>

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
